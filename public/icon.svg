<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131b"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a2b"/>
      <stop offset="100%" stop-color="#e60012"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Dark Background with Comic Angled Cuts -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Red Halftone Slit in background -->
  <polygon points="0,60 512,180 512,450 0,330" fill="#e60012" opacity="0.15"/>
  <polygon points="80,0 512,0 512,512 432,512" fill="#000000" opacity="0.25"/>

  <!-- Comic Angular Starburst / Diamond -->
  <polygon points="256,40 450,256 256,472 62,256" fill="#181924" stroke="#000000" stroke-width="6"/>
  <polygon points="256,60 430,256 256,452 82,256" fill="none" stroke="#e60012" stroke-width="4"/>

  <!-- Headphones Arc -->
  <path d="M 140 250 A 116 116 0 0 1 372 250" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 155 245 A 101 101 0 0 1 357 245" fill="none" stroke="#e60012" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Headphone Ear Cup -->
  <rect x="110" y="220" width="34" height="64" rx="8" fill="#e60012" stroke="#000000" stroke-width="5" filter="url(#shadow)"/>
  <rect x="118" y="232" width="18" height="40" rx="4" fill="#ffffff"/>

  <!-- Right Headphone Ear Cup -->
  <rect x="368" y="220" width="34" height="64" rx="8" fill="#e60012" stroke="#000000" stroke-width="5" filter="url(#shadow)"/>
  <rect x="376" y="232" width="18" height="40" rx="4" fill="#ffffff"/>

  <!-- Persona 5 Phantom Mask (Center) -->
  <g filter="url(#shadow)">
    <!-- Mask Body: Sharp Black & Red Wings -->
    <path d="M 170,250 Q 210,210 256,230 Q 302,210 342,250 Q 370,285 342,320 Q 300,340 256,365 Q 212,340 170,320 Q 142,285 170,250 Z" 
          fill="#000000" stroke="#ffffff" stroke-width="7"/>
    
    <!-- Mask Accent Trim -->
    <path d="M 185,255 Q 215,225 256,242 Q 297,225 327,255 Q 350,282 327,310 Q 295,328 256,348 Q 217,328 185,310 Q 162,282 185,255 Z" 
          fill="#e60012"/>

    <!-- Left Eye Cutout -->
    <polygon points="195,275 240,265 235,285 205,295" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    
    <!-- Right Eye Cutout -->
    <polygon points="317,275 272,265 277,285 307,295" fill="#ffffff" stroke="#000000" stroke-width="3"/>

    <!-- Center Phantom Star / Play Emblem -->
    <polygon points="256,275 264,290 280,290 267,300 272,315 256,305 240,315 245,300 232,290 248,290" fill="#ffd700" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Soundwave Bars below Mask -->
  <g transform="translate(196, 385)">
    <rect x="0" y="8" width="8" height="24" fill="#ffd700" stroke="#000" stroke-width="2"/>
    <rect x="16" y="0" width="8" height="36" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <rect x="32" y="14" width="8" height="18" fill="#e60012" stroke="#000" stroke-width="2"/>
    <rect x="48" y="2" width="8" height="32" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <rect x="64" y="6" width="8" height="28" fill="#ffd700" stroke="#000" stroke-width="2"/>
    <rect x="80" y="16" width="8" height="14" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <rect x="96" y="4" width="8" height="30" fill="#e60012" stroke="#000" stroke-width="2"/>
    <rect x="112" y="10" width="8" height="20" fill="#ffffff" stroke="#000" stroke-width="2"/>
  </g>

  <!-- P5 Style Badge Ribbon Top Right -->
  <polygon points="370,50 490,50 460,95 340,95" fill="#e60012" stroke="#000" stroke-width="4"/>
  <text x="405" y="82" font-family="Impact, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="2">P5</text>
</svg>
